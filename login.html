<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="./login.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="container d-flex w-100 justify-content-center align-items-center p-3 ">
      <div class="image">
        <img src="./assets/favico.png" alt="">
      </div>
    <div >
        <h1 class="gris text-nowrap">
          Agritech App
      </h1>
    </div>
    </div>
    <div class="container largueur rounded-3 overflow-hidden">

      <form class=" w-100 p-4 m-auto">
        <h2 class="w-100 text-center">Login</h2>
        <div class="mt-3 line">
          <label for="exampleInputEmail1" class="form-label fw-bolder"> Veuillez saisir votre Email <span
              class="text-danger">*</span> </label>
          <input type="email" class="form-control" placeholder="Email" id="exampleInputEmail1"
            aria-describedby="emailHelp">
        </div>
        <div class="mt-3 line">
          <label for="exampleInputPassword1" class="form-label fw-bolder">Veuillez saisir votre Mot de passe <span
              class="text-danger">*</span></label>
          <input type="password" class="form-control " placeholder="Password" id="exampleInputPassword1">
        </div>
        <div class="mt-3 form-check">
          <input type="checkbox" class="form-check-input rounded-5" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Se souvenir de moi</label>
        </div>
        <div class="content mt-3 w-100 text-end">
          <button type="submit" class="btn btn-success raduis rounded-5 p-3">
           <a class="text-decoration-none text-white" href="./index.html">
             Login
            <i class="bi bi-arrow-up-right"></i>
           </a>
          </button>

        </div>
        <p class=" mt-3">Veuillez contactez un administrateur si vous avez oublié votre mot de passe</p>
      </form>

    </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
